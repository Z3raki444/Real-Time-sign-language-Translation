name: Python source checks
on:
  push:
  pull_request:
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m compileall -q scripts
      - run: test -f Model/labels.txt
      - run: test -f Model/keras_model.h5
      - run: test -f requirements.txt
